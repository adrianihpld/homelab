---
- name: Baseline configuration for all k3s cluster nodes
  hosts: all
  become: true

  tasks:
    - name: Check current subscription status
      ansible.builtin.command: subscription-manager identity
      register: subscription_status
      changed_when: false
      failed_when: false

    - name: Register system with Red Hat
      ansible.builtin.command: >
        subscription-manager register
        --username {{ rhsm_username }}
        --password {{ rhsm_password }}
        --auto-attach
      when: subscription_status.rc != 0
      no_log: true

    - name: Set hostname to match inventory name
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Update all packages
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_cache: true

    - name: Open k3s ports required on all nodes
      ansible.posix.firewalld:
        port: "{{ item }}"
        permanent: true
        immediate: true
        state: enabled
      loop:
        - "8472/udp"
        - "10250/tcp"
        - "80/tcp"
        - "443/tcp"

    - name: Open k3s API server port on control plane only
      ansible.posix.firewalld:
        port: "6443/tcp"
        permanent: true
        immediate: true
        state: enabled
      when: inventory_hostname in groups['k3s_control_plane']

    - name: Enable masquerading for k3s pod networking
      ansible.posix.firewalld:
        masquerade: true
        permanent: true
        immediate: true
        state: enabled
    
    - name: Trust flannel and cni interfaces in firewalld
      ansible.posix.firewalld:
        zone: trusted
        interface: "{{ item }}"
        permanent: true
        immediate: true
        state: enabled
      loop:
        - flannel.1
        - cni0
