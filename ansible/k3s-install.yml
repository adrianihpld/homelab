---
- name: Install k3s server on control plane
  hosts: k3s_control_plane
  become: true

  tasks:
    - name: Download and run k3s install script
      ansible.builtin.shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /var/lib/rancher/k3s/server/node-token

    - name: Read the node token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: node_token_raw

    - name: Save node token as a fact
      ansible.builtin.set_fact:
        node_token: "{{ node_token_raw.content | b64decode | trim }}"
    
    - name: Create .kube directory for user
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0700'

    - name: Copy k3s kubeconfig to user's kube config
      ansible.builtin.copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "/home/{{ ansible_user }}/.kube/config"
        remote_src: true
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'

    - name: Set KUBECONFIG in user's bashrc
      ansible.builtin.lineinfile:
        path: "/home/{{ ansible_user }}/.bashrc"
        line: "export KUBECONFIG=/home/{{ ansible_user }}/.kube/config"
        create: true

- name: Install k3s agent on worker nodes
  hosts: k3s_workers
  become: true

  tasks:
    - name: Install k3s agent and join the cluster
      ansible.builtin.shell: >
        curl -sfL https://get.k3s.io |
        K3S_URL=https://{{ hostvars[groups['k3s_control_plane'][0]]['ansible_host'] }}:6443
        K3S_TOKEN={{ hostvars[groups['k3s_control_plane'][0]]['node_token'] }}
        sh -
      args:
        creates: /usr/local/bin/k3s-agent	
